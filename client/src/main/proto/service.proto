syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.sbertech";
option java_outer_classname = "RateProvider";

package rateProvider;

service RateService {
  rpc GetCurrencyRate (GetRate) returns (GetRateResponse) {}
}

message GetRate {
  string currencyFrom = 1;
  string currencyTo = 2;
}

message GetRateResponse {
  double rate = 1;
}
